<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admas University Portal</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- LOGIN -->
<div class="screen active" id="login">
  <div class="card center">
    <h1>🎓 Admas University</h1>

    <input id="username" placeholder="Username">
    <input id="password" type="password" placeholder="Password">

    <button onclick="login()">Login</button>
  </div>
</div>

<!-- ADMIN -->
<div class="screen" id="admin">
  <header>
    <h2>Admin Dashboard</h2>
    <button onclick="logout()">Logout</button>
  </header>

  <div class="card">
    <input id="studentId" placeholder="Student ID">
    <input id="subject" placeholder="Subject">
    <input id="score" type="number" placeholder="Score">

    <button onclick="addGrade()">Add Grade</button>
  </div>

  <div class="card">
    <h3>Saved Records (Dashboard)</h3>
    <div id="records"></div>
  </div>
</div>

<!-- STUDENT -->
<div class="screen" id="student">
  <header>
    <h2>Student Portal</h2>
    <button onclick="logout()">Logout</button>
  </header>

  <div class="card center">
    <input id="searchId" placeholder="Enter Student ID">
    <button onclick="viewGrades()">View Grades</button>

    <div id="result"></div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
